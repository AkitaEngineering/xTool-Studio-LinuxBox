services:
  xtool-studio:
    image: ${XTOOL_IMAGE:-xtool-custom-amd}
    build:
      context: .
      dockerfile: ${XTOOL_CONTAINERFILE:-containerfile.amd}
    container_name: xtool-studio-compose
    userns_mode: "keep-id:uid=1001,gid=1001"
    network_mode: host
    privileged: true
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/xtool-Xauthority
      - QT_X11_NO_MITSHM=1
      - NO_AT_BRIDGE=1
      - LANG=en_US.UTF-8
      - LC_ALL=en_US.UTF-8
      - XTOOL_URL=${XTOOL_URL:-}
      - XTOOL_EXPERIMENTAL=${XTOOL_EXPERIMENTAL:-}
      - XTOOL_FORCE_SOFTWARE_RENDERING=${XTOOL_FORCE_SOFTWARE_RENDERING:-0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - type: bind
        source: ${XAUTHORITY:-${HOME}/.Xauthority}
        target: /tmp/xtool-Xauthority
        read_only: true
        bind:
          create_host_path: false
      - ${HOME}:/home/sliceruser:rw
    command:
      - /bin/bash
      - -lc
      - |
        set -euo pipefail
        resolve_xtool_url() {
          local notes_url="https://support.xtool.com/article/1773"
          local supported_version="1.9.11"
          local supported_url="https://storage.atomm.com/efficacy/atomm-package/packages/109/afffecbb-38d7-40ed-8bba-7e7acee5c18c/xTool-Studio-x64-1.9.11.exe"
          local notes picked
          if [ -n "$${XTOOL_URL:-}" ]; then
            printf "%s\n" "$$XTOOL_URL"
            return 0
          fi
          notes=$$(curl --fail -fsSL --retry 5 --retry-delay 2 --connect-timeout 15 --max-time 60 "$$notes_url" || true)
          if [ "$${XTOOL_EXPERIMENTAL:-}" = "1" ]; then
            echo "Experimental xTool Studio build selected. LinuxBox supports $$supported_version." >&2
            picked=$$(printf "%s" "$$notes" | grep -oE 'https://storage\.atomm\.com/[^"[:space:]]+/xTool-Studio-x64-[0-9.]+\.exe' | head -n 1 || true)
          else
            picked=$$(printf "%s" "$$notes" | grep -oE 'https://storage\.atomm\.com/[^"[:space:]]+/xTool-Studio-x64-[0-9.]+\.exe' | grep -F "xTool-Studio-x64-$$supported_version.exe" | head -n 1 || true)
          fi
          if [ -n "$$picked" ]; then
            printf "%s\n" "$$picked"
          else
            printf "%s\n" "$$supported_url"
          fi
        }
        XTOOL_DOWNLOAD_URL=$$(resolve_xtool_url)
        mkdir -p "$$HOME/.local/bin" "$$HOME/.local/share/xtool-studio/downloads"
        XTOOL_URL_FILE="$$HOME/.local/share/xtool-studio/last-download-url"
        XTOOL_INSTALLER_PATH="$$HOME/.local/share/xtool-studio/downloads/xTool-Studio-setup.exe"
        exec 9>>"$$HOME/.local/share/xtool-studio/.install.lock"
        perl -MFcntl=:flock -e 'flock(STDIN, LOCK_EX | LOCK_NB) or die "Could not lock xTool Studio data. Another installation may be running ($$!).\n";' <&9
        XTOOL_DOWNLOAD_TEMP=""
        trap '[ -z "$$XTOOL_DOWNLOAD_TEMP" ] || rm -f -- "$$XTOOL_DOWNLOAD_TEMP"' EXIT
        if [ ! -s "$$XTOOL_INSTALLER_PATH" ] || [ ! -f "$$XTOOL_URL_FILE" ] || [ "$$(cat "$$XTOOL_URL_FILE" 2>/dev/null || true)" != "$$XTOOL_DOWNLOAD_URL" ]; then
          XTOOL_DOWNLOAD_TEMP=$$(mktemp "$$HOME/.local/share/xtool-studio/downloads/.xtool-download.XXXXXX")
          curl --fail -L --retry 5 --retry-delay 2 --connect-timeout 15 --max-time 1200 --progress-bar -o "$$XTOOL_DOWNLOAD_TEMP" -- "$$XTOOL_DOWNLOAD_URL"
          [ -s "$$XTOOL_DOWNLOAD_TEMP" ] || { echo 'The xTool Studio download was empty.' >&2; exit 1; }
          rm -f -- "$$XTOOL_URL_FILE"
          mv -f -- "$$XTOOL_DOWNLOAD_TEMP" "$$XTOOL_INSTALLER_PATH"
          printf "%s\n" "$$XTOOL_DOWNLOAD_URL" > "$$XTOOL_URL_FILE"
        fi
        perl -MFcntl=:flock -e 'flock(STDIN, LOCK_UN) or die "Could not unlock xTool Studio data ($$!).\n";' <&9
        exec 9>&-
        trap - EXIT
        printf '%s\n' \
          '#!/bin/sh' \
          'set -eu' \
          'APP_HOME="$$HOME/.local/share/xtool-studio"' \
          'PREFIX_DIR="$$APP_HOME/prefix"' \
          'INSTALLER_PATH="$$APP_HOME/downloads/xTool-Studio-setup.exe"' \
          'mkdir -p "$$APP_HOME" "$$APP_HOME/downloads"' \
          'export WINEPREFIX="$$PREFIX_DIR"' \
          'export WINEARCH=win64' \
          'if [ ! -d "$$PREFIX_DIR" ]; then' \
          '  wineboot -u >/dev/null 2>&1 || true' \
          'fi' \
          'if [ "$${XTOOL_FORCE_SOFTWARE_RENDERING:-0}" = "1" ]; then' \
          '  export LIBGL_ALWAYS_SOFTWARE="$${LIBGL_ALWAYS_SOFTWARE:-1}"' \
          '  export GALLIUM_DRIVER="$${GALLIUM_DRIVER:-llvmpipe}"' \
          '  export MESA_LOADER_DRIVER_OVERRIDE="$${MESA_LOADER_DRIVER_OVERRIDE:-llvmpipe}"' \
          'fi' \
          'APP_EXE=$$(find "$$PREFIX_DIR/drive_c" -type f \( -iname "xTool Studio*.exe" -o -iname "xTool-Studio*.exe" -o -iname "xToolStudio*.exe" \) ! -iname "*setup*.exe" ! -iname "*unins*.exe" ! -iname "*uninstall*.exe" ! -iname "*update*.exe" 2>/dev/null | sort | head -n 1)' \
          'if [ -z "$$APP_EXE" ]; then' \
          '  wine "$$INSTALLER_PATH"' \
          '  APP_EXE=$$(find "$$PREFIX_DIR/drive_c" -type f \( -iname "xTool Studio*.exe" -o -iname "xTool-Studio*.exe" -o -iname "xToolStudio*.exe" \) ! -iname "*setup*.exe" ! -iname "*unins*.exe" ! -iname "*uninstall*.exe" ! -iname "*update*.exe" 2>/dev/null | sort | head -n 1)' \
          'fi' \
          '[ -n "$$APP_EXE" ] || { echo "xTool Studio executable not found after installer exit." >&2; exit 1; }' \
          'exec wine "$$APP_EXE" "$$@"' \
          > "$$HOME/.local/bin/xToolStudio"
        chmod +x "$$HOME/.local/bin/xToolStudio"
        exec "$$HOME/.local/bin/xToolStudio"
